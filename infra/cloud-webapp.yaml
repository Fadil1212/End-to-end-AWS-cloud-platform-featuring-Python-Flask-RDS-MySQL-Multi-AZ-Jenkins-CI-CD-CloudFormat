AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud Computing NSRL MySQL 8.4 Multi-AZ RDS, Private S3, Secrets Manager, and EC2 Python Web App Server
Parameters:
  DBName:
    Type: String
    Default: jj_nsrl
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{1,30}$'
    Description: MySQL database name such as jj_nsrl
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
  MultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable RDS MySQL Multi-AZ synchronous Standby DB
  VpcId:
    Type: AWS::EC2::VPC::Id
  WebAppSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (with outbound internet route for package setup) for the private-access EC2 Python Web App Server
  DBSubnetGroupName:
    Type: String
    Description: Existing RDS DB subnet group NAME spanning at least two AZs
  JenkinsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID of the Jenkins EC2 host
  WebAppInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  WebAppAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  LabInstanceProfile:
    Type: String
    Default: LabInstanceProfile
Conditions:
  UseMultiAZ: !Equals [!Ref MultiAZ, 'true']
Resources:
  ScriptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  ScriptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ScriptsBucket.Arn
              - !Sub '${ScriptsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Cloud Computing NSRL MySQL RDS admin credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"nsrl_admin"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludePunctuation: true
  WebAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private EC2 Python Web App Server - reached via SSM tunnel or Jenkins inside VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref JenkinsSecurityGroupId
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private MySQL 3306 from Jenkins host and EC2 Python Web App Server only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref JenkinsSecurityGroupId
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebAppSecurityGroup
  DBParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: mysql8.4
      Description: Enforce TLS/SSL encrypted MySQL 8.4 connections
      Parameters:
        require_secure_transport: 'ON'
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.4'
      DBName: !Ref DBName
      AllocatedStorage: !Ref AllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      StorageType: gp2
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${AdminSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${AdminSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroupName
      DBParameterGroupName: !Ref DBParameters
      VPCSecurityGroups: [!GetAtt DBSecurityGroup.GroupId]
      PubliclyAccessible: false
      MultiAZ: !If [UseMultiAZ, true, false]
      BackupRetentionPeriod: 1
      MonitoringInterval: 0
      EnableCloudwatchLogsExports: [error, slowquery]
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
  WebAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/nsrl/mysql/${AWS::StackName}/webapp'
      RetentionInDays: 7
  WebAppHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WebAppAmi
      InstanceType: !Ref WebAppInstanceType
      IamInstanceProfile: !Ref LabInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref WebAppSubnetId
          GroupSet: [!Ref WebAppSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-webapp'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y python3 python3-pip unzip
          systemctl enable --now amazon-ssm-agent
          mkdir -p /opt/nsrl-webapp /opt/rds
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /opt/rds/global-bundle.pem
          python3 -m venv /opt/nsrl-webapp/venv
          /opt/nsrl-webapp/venv/bin/pip install --no-cache-dir boto3 pymysql cryptography flask gunicorn
          cat <<'ENVEOF' > /opt/nsrl-webapp/webapp.env
          AWS_REGION=${AWS::Region}
          DB_HOST=${Database.Endpoint.Address}
          DB_PORT=3306
          DB_NAME=${DBName}
          DB_IDENTIFIER=${Database}
          DB_SECRET_ARN=${AdminSecret}
          SCRIPTS_BUCKET=${ScriptsBucket}
          RDS_CA_BUNDLE=/opt/rds/global-bundle.pem
          DB_SSL_VERIFY_HOSTNAME=true
          APP_PORT=8080
          ENVEOF
          chmod 600 /opt/nsrl-webapp/webapp.env
Outputs:
  DBEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DBPort:
    Value: !GetAtt Database.Endpoint.Port
  DBName:
    Value: !Ref DBName
  DBIdentifier:
    Value: !Ref Database
  DBSecurityGroupId:
    Value: !GetAtt DBSecurityGroup.GroupId
  AdminSecretArn:
    Value: !Ref AdminSecret
  ScriptsBucketName:
    Value: !Ref ScriptsBucket
  MultiAZEnabled:
    Value: !Ref MultiAZ
  WebAppInstanceId:
    Value: !Ref WebAppHost
  WebAppPrivateIp:
    Value: !GetAtt WebAppHost.PrivateIp
  WebAppSecurityGroupId:
    Value: !GetAtt WebAppSecurityGroup.GroupId
  WebAppLogGroupName:
    Value: !Ref WebAppLogGroup
